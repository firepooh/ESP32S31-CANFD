# 태그(v*)를 푸시하면 ESP-IDF로 빌드해 GitHub 릴리즈에 바이너리를 올린다.
# 릴리즈를 올린 뒤에는 웹 플래셔(pages.yml)를 다시 만들어 새 버전을 목록에 넣는다.
# 수동 실행(workflow_dispatch)은 빌드만 하고 결과를 Actions 아티팩트로 남긴다.
name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 릴리즈 생성, 파일 업로드
  actions: write # 웹 플래셔 워크플로 실행

env:
  IDF_VERSION: v6.1
  IDF_TARGET: esp32s31
  APP_NAME: s31_canfd_test

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 수동 실행 때 git describe로 버전을 정하므로 태그 이력이 필요하다

      - name: Set firmware version
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="$(git describe --tags --always)"
          fi
          # version.txt가 있으면 IDF는 git describe 대신 이 값을 앱 버전으로 쓴다
          echo "${VER}" > version.txt
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "base=${APP_NAME}-${IDF_TARGET}-${VER}" >> "$GITHUB_OUTPUT"

      - name: Build (ESP-IDF ${{ env.IDF_VERSION }}, ${{ env.IDF_TARGET }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ env.IDF_TARGET }}
          # 프리뷰 타깃이면 idf.py에 --preview를 붙인다 (apply.py --preview).
          # merge-bin은 build/merged.bin (0x0부터 쓰는 단일 이미지)을 만든다.
          command: idf.py --preview build && idf.py --preview merge-bin -o merged.bin

      - name: Package
        env:
          VER: ${{ steps.ver.outputs.ver }}
          BASE: ${{ steps.ver.outputs.base }}
        run: |
          set -euo pipefail
          OUT=dist
          rm -rf "$OUT"
          mkdir -p "$OUT/$BASE/bootloader" "$OUT/$BASE/partition_table"
          # 빌드 폴더는 컨테이너의 root 소유라 읽기만 하고, 결과는 dist/에 만든다
          cp build/bootloader/bootloader.bin "$OUT/$BASE/bootloader/"
          cp build/partition_table/partition-table.bin "$OUT/$BASE/partition_table/"
          cp "build/${APP_NAME}.bin" "build/${APP_NAME}.elf" build/flash_args build/flasher_args.json sdkconfig "$OUT/$BASE/"
          cp build/merged.bin "$OUT/${BASE}-merged.bin"
          (cd "$OUT" && zip -qr "${BASE}-all.zip" "$BASE" && rm -rf "$BASE")
          (cd "$OUT" && sha256sum "${BASE}-merged.bin" "${BASE}-all.zip" > SHA256SUMS.txt)

          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -e "s|{VER}|${VER}|g" \
              -e "s|{BASE}|${BASE}|g" \
              -e "s|{IDF_VERSION}|${IDF_VERSION}|g" \
              -e "s|{IDF_TARGET}|${IDF_TARGET}|g" \
              -e "s|{SHA}|${GITHUB_SHA}|g" \
              -e "s|{FLASHER_URL}|https://${OWNER}.github.io/${REPO}/|g" \
              .github/release-notes.md > "$OUT/notes.md"
          ls -l "$OUT"
          cat "$OUT/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.base }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.ver.outputs.base }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          FILES=("dist/${BASE}-merged.bin" "dist/${BASE}-all.zip" dist/SHA256SUMS.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # 웹에서 먼저 만든 릴리즈는 본문을 그대로 두고 파일만 올린다
            gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            PRE=()
            case "$TAG" in *-*) PRE=(--prerelease) ;; esac # v1.2.0-rc1 같은 태그는 프리릴리즈
            gh release create "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "${APP_NAME} ${TAG}" --notes-file dist/notes.md --verify-tag "${PRE[@]}"
          fi

      - name: Rebuild web flasher
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN으로 만든 릴리즈는 다른 워크플로를 깨우지 않으므로 직접 실행한다.
          # 기본 브랜치에서 실행해야 github-pages 환경의 배포 제한에 걸리지 않는다.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
